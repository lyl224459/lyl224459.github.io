name: Homepage Check

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Validate build artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required_files = [
              Path("index.html"),
              Path("README.md"),
              Path("package.json"),
              Path("src/index.html"),
              Path("src/main.ts"),
              Path("src/styles/main.scss"),
              Path("dist/index.html"),
          ]
          missing_files = [str(path) for path in required_files if not path.is_file()]
          if missing_files:
              raise SystemExit("Missing required files: " + ", ".join(missing_files))

          required_dirs = [Path("assets")]
          missing_dirs = [str(path) for path in required_dirs if not path.is_dir()]
          if missing_dirs:
              raise SystemExit("Missing required directories: " + ", ".join(missing_dirs))

          index = Path("src/index.html").read_text(encoding="utf-8")
          root_index = Path("index.html").read_text(encoding="utf-8")
          dist_index = Path("dist/index.html").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          package = Path("package.json").read_text(encoding="utf-8")
          main = Path("src/main.ts").read_text(encoding="utf-8")

          checks = {
              "homepage title": "<title>lyl224459 | GitHub Homepage</title>" in index,
              "favicon binding": 'id="siteFavicon"' in index,
              "vite entry": 'src="/main.ts"' in index,
              "root build snapshot": root_index == dist_index,
              "root css asset": '<link rel="stylesheet"' in root_index and "/assets/" in root_index,
              "bootstrap dependency": '"bootstrap": "5.3.8"' in package,
              "typescript entry": "function bootstrapApp()" in main,
              "README quick start": "## 快速开始" in readme,
              "README release checklist": "## 发布前检查清单" in readme,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Validation failed: " + ", ".join(failed))

          print("Homepage build checks passed.")
          PY

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
